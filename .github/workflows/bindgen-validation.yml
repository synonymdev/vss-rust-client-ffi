name: Bindgen Validation

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Scripts, Rust, and Android manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check shell scripts
        run: bash -n build.sh build_ios.sh build_android.sh

      - name: Check Rust package
        run: cargo check --locked

      - name: Check Android Gradle project
        working-directory: bindings/android
        run: ./gradlew projects --no-daemon

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets

  swift-manifest:
    name: SwiftPM manifest
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Swift package manifest
        run: swift package dump-package >/dev/null
