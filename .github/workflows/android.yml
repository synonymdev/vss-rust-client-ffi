name: Android Bindgen

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  android-bindgen:
    name: Android Bindgen
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler zip unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Export Android NDK root
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Generate Android bindings and artifacts
        run: ./build_android.sh

      - name: Verify Android outputs
        run: |
          test -f bindings/android/src/main/kotlin/com/synonym/vssclient/vss_rust_client_ffi.kt
          test -f bindings/android/src/main/jniLibs/arm64-v8a/libvss_rust_client_ffi.so
          test -f bindings/android/src/main/jniLibs/armeabi-v7a/libvss_rust_client_ffi.so
          test -f bindings/android/src/main/jniLibs/x86/libvss_rust_client_ffi.so
          test -f bindings/android/src/main/jniLibs/x86_64/libvss_rust_client_ffi.so
          test -f bindings/android/native-debug-symbols.zip

      - name: Upload Android generated outputs
        uses: actions/upload-artifact@v4
        with:
          name: vss-android-bindgen
          path: |
            bindings/android/src/main/kotlin/com/synonym/vssclient/vss_rust_client_ffi.kt
            bindings/android/src/main/jniLibs/**/libvss_rust_client_ffi.so
            bindings/android/native-debug-symbols.zip
          if-no-files-found: error
