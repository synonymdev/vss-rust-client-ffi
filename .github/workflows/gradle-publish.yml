# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is published
# For more info see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to publish (e.g., v0.5.19 or 0.5.19)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Normalize release version
      id: version
      shell: bash
      run: |
        VERSION="${{ github.event.inputs.version || github.event.release.tag_name || github.ref_name }}"
        TAG="$VERSION"
        if [[ "$TAG" != v* ]]; then
          TAG="v$TAG"
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v7
      with:
        ref: ${{ steps.version.outputs.tag }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github
        settings-path: ${{ github.workspace }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Install native build dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config protobuf-compiler

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28c
        add-to-path: true

    - name: Export Android NDK
      shell: bash
      run: |
        NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
        cat "$NDK_PATH/source.properties"
        grep -Fx "Pkg.Revision = 28.2.13676358" "$NDK_PATH/source.properties"

    - name: Generate Android bindings
      run: ./build_android.sh

    - name: Build with Gradle
      working-directory: bindings/android
      run: ./gradlew build validateReleaseNativeLibraries -Pversion=${{ steps.version.outputs.version }}

    - name: Upload native debug symbols artifact
      uses: actions/upload-artifact@v7
      with:
        name: vss-client-native-debug-symbols-${{ steps.version.outputs.version }}
        path: bindings/android/native-debug-symbols.zip

    - name: Upload native debug symbols to release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${{ steps.version.outputs.tag }}" bindings/android/native-debug-symbols.zip --clobber

    - name: Publish to GitHub Packages
      working-directory: bindings/android
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPO: ${{ github.repository }}
      run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}
